# 下载器 qBittorrent
# 参考文档：docs/07-应用服务/7.3-下载与同步.md
version: "3.8"

services:
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
      - WEBUI_PORT=8080
    volumes:
      - ${NAS_DATA:-/volume1/docker}/qbittorrent/config:/config
      - /volume1/downloads:/downloads   # 修改为你的下载目录
    ports:
      - "8080:8080"       # Web UI
      - "6881:6881"       # BT
      - "6881:6881/udp"
    restart: unless-stopped
