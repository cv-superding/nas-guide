# Paperless-ngx — 文档 OCR 归档
# 参考文档：docs/14-热门应用实战/14.3-Paperless-ngx.md
# 基于官方 Compose 改写，路径改为 NAS 通用写法
# ⚠️ 部署前务必修改 ADMIN_USER / ADMIN_PASSWORD / TIME_ZONE
version: "3.8"

services:
  db:
    image: postgres:16
    container_name: paperless-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASS:-CHANGE_ME}
    volumes:
      - ${NAS_DATA:-/volume1/docker}/paperless-ngx/db:/var/lib/postgresql/data

  broker:
    image: redis:7
    container_name: paperless-broker
    restart: unless-stopped
    volumes:
      - ${NAS_DATA:-/volume1/docker}/paperless-ngx/redis:/data

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-web
    restart: unless-stopped
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    ports:
      - "8010:8000"
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASS:-CHANGE_ME}
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:-CHANGE_ME}
      PAPERLESS_TIME_ZONE: ${TZ:-Asia/Shanghai}
      PAPERLESS_OCR_LANGUAGE: chi_sim+eng
    volumes:
      - ${NAS_DATA:-/volume1/docker}/paperless-ngx/data:/usr/src/paperless/data
      - ${NAS_DATA:-/volume1/docker}/paperless-ngx/media:/usr/src/paperless/media
      - ${NAS_DATA:-/volume1/docker}/paperless-ngx/export:/usr/src/paperless/export
      - ${NAS_DATA:-/volume1/docker}/paperless-ngx/consume:/usr/src/paperless/consume

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: paperless-gotenberg
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"

  tika:
    image: ghcr.io/paperless-ngx/tika:latest
    container_name: paperless-tika
    restart: unless-stopped
