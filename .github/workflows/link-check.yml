name: Check Links

on:
  schedule:
    - cron: '0 0 * * 1'   # 每周一检查
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --accept 200,204,206,429 '**/*.md'
          fail: false
