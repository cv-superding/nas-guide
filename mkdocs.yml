site_name: NAS 入门指南
site_url: https://cv-superding.github.io/nas-guide/
site_description: 从零开始的 NAS 搭建与自托管实践 · 面向中文读者 · 多平台横向对比
site_author: cv-superding
repo_url: https://github.com/cv-superding/nas-guide
repo_name: cv-superding/nas-guide
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - navigation.expand
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  icon:
    logo: material/harddisk
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: zh
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
      enable_git_follow: false

# 指向 docs/ 之外目录（examples/、exercises/ 等）的链接在 GitHub 上有效，
# 但它们不属于文档站点，因此关闭「未找到」级别的严格校验。
validation:
  links:
    not_found: ignore

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cv-superding
  footer: 本项目采用 MIT 许可证 · 仅供学习与交流

